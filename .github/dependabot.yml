# Version updates. Security updates are enabled in the repository settings and
# ignore the schedule and the groups below, but they do honor the `ignore`
# entries, so nothing here should block a fix for a real advisory.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# One npm entry covers the whole workspace: pnpm-lock.yaml lives at the root,
# pnpm-workspace.yaml maps `packages/*`, and Dependabot reads every member
# manifest from there. The package.json files under
# packages/ts-migrate-plugins/tests/fixtures are outside that glob, so the
# eslint, module-format, and update-import-paths fixtures keep the exact
# dependency shapes their tests assert on.
#
# The pnpm.overrides block in the root package.json stays manual. Those entries
# pin transitive versions that no manifest declares, and Dependabot only edits
# declared dependencies.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"

    # Pull requests are squash-merged, so the title becomes the commit message
    # and has to satisfy pr-title.yml. A runtime dependency reaches consumers
    # on the next publish, so it takes `fix` and earns a patch release from
    # lerna; a dev dependency takes `chore` and releases nothing. `scope`
    # supplies the (deps) and (deps-dev) suffixes.
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"

    # The published packages declare caret ranges. Raising a floor on every
    # patch would tighten what consumers can resolve for no reason, so leave
    # the range alone while it still matches and let the update land in
    # pnpm-lock.yaml, which is the file CI installs from.
    versioning-strategy: increase-if-necessary

    open-pull-requests-limit: 10

    # Minor and patch updates batch into two pull requests. Majors stay
    # separate: each one needs its own review and its own run through the
    # TypeScript and Node matrix.
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

    ignore:
      # `eslint-v8` is an alias for eslint 8 and exists so the plugins tests
      # can exercise the eslintrc path against the last major that supports
      # it. Moving it to 9 removes the only coverage of that path.
      - dependency-name: "eslint-v8"
        update-types: ["version-update:semver-major"]

      # `typescript6` is an alias holding the 6.x compiler the server tests
      # load. The major is the fixture, not a version to keep current.
      - dependency-name: "typescript6"
        update-types: ["version-update:semver-major"]

      # The react plugins transform propTypes-era class components and the
      # fixtures are written against that API. Moving React off 16 is a
      # migration of those fixtures, not a dependency bump.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"

    commit-message:
      prefix: "ci"
      include: "scope"

    # Action majors are usually a runner or Node bump, so one pull request for
    # all of .github/workflows is easier to read than four.
    groups:
      github-actions:
        patterns:
          - "*"
