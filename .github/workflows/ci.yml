name: CI

# Docs and repo meta that no CI job reads. Neither AGENTS.md is listed:
# agentsPlaybook.test.ts asserts on packages/ts-migrate/AGENTS.md, and the root
# AGENTS.md carries the conventions the lockfile job below enforces.
# lerna.json and .nxignore are release-only config; ci.yml never invokes lerna.
on:
  push:
    branches: [master]
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'packages/*/README.md'
      - 'packages/*/CHANGELOG.md'
      - 'packages/*/LICENSE'
      - '.gitattributes'
      - '.gitignore'
      - '.vscode/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'lerna.json'
      - '.nxignore'
  pull_request:
    branches: [master]
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'packages/*/README.md'
      - 'packages/*/CHANGELOG.md'
      - 'packages/*/LICENSE'
      - '.gitattributes'
      - '.gitignore'
      - '.vscode/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'lerna.json'
      - '.nxignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

  # pnpm-lock.yaml is not in the paths-ignore lists above, so every pull
  # request that can flip a resolution reaches this job. It reads committed
  # refs only: the build matrix below runs `pnpm add` to swap the compiler on
  # its own runner, and that mutation never reaches a diff.
  lockfile:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the TypeScript resolutions
        run: scripts/check-lockfile-typescript.sh ${{ github.event.pull_request.base.sha }}

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # SyntaxKind numbering differs between TypeScript 5.8 and 5.9; 6.0 deprecates
        # legacy module resolution and ships a new lib. That axis has caught real
        # breakage, so it keeps three versions: the peer floor, 5.9, and 6.x.
        #
        # The Node axis is two jobs and neither of them is a "line": the engines
        # floor, and the newest Node there is. No CI run has failed on one Node
        # version while passing the others, and 22.18 through 26 were identical on
        # every check of the yargs 18 move, so the versions in between carry no
        # information and 24 is deliberately absent. What does vary is either side
        # of the supported range, which is what these two cover.
        node-version: ['22']
        typescript-version: ['5.7.3', '5.9.3', '6.0.3']
        include:
          # The one Node-specific job, and it is about the floor rather than the
          # line: a bare '22' resolves to the newest 22, so it never builds what
          # engines claims. 22.18.0 is where `process.exit()` stopped truncating a
          # pending stderr write at 8192 bytes; below it the CLI loses the tail of
          # any error longer than that, which is most of a rejected flag on `full`
          # or `migrate`.
          - node-version: '22.18'
            typescript-version: '5.9.3'
          - node-version: '26'
            typescript-version: '5.9.3'

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Use TypeScript ${{ matrix.typescript-version }}
        run: |
          if [ "$(node -p "require('typescript').version")" != "${{ matrix.typescript-version }}" ]; then
            pnpm add -w -D -E typescript@${{ matrix.typescript-version }}
          fi

      # The matrix swaps typescript without changing any file a content hash would
      # see. Never put a task cache (nx/turbo) in front of these builds: a warm
      # cache reports success over a failing tsc.
      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

      - name: Example smoke test
        run: |
          pnpm -C packages/ts-migrate-example run example
          grep -q 'first: number, second: number): number' packages/ts-migrate-example/src/input/index.ts
          git checkout -- packages/ts-migrate-example/src/input/index.ts
